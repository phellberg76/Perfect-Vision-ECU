[package]
name = "planter-ble-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Perfect Precision PCB Designs"]
description = "BLE to HTTP bridge for Planter App - proxies BLE requests to Java backend"
license = "MIT"
rust-version = "1.70"

[dependencies]
# Bluetooth via BlueZ - GATT is included by default
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# HTTP client for proxying to Java app
reqwest = { version = "0.12", features = ["json"] }

# Serialization for protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Base64 for binary file transfer
base64 = "0.22"

# UUID generation
uuid = { version = "1.8", features = ["v4"] }

# Async utilities
futures = "0.3"

# Serial port for UART mode
serialport = "4.3"

# URL encoding for parsing query parameters
urlencoding = "2.1"

# OpenSSL - vendored for cross-compilation
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
