# GPS Hat v4 - nginx reverse proxy configuration
#
# Routes requests from ESP32 HTTP proxy to backend services:
#   /planter_app/* -> planter app on port 8080
#   /*             -> web interface on port 8081
#
# Install: sudo cp nginx-gps-hat.conf /etc/nginx/sites-available/gps-hat
#          sudo ln -sf /etc/nginx/sites-available/gps-hat /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo systemctl restart nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Planter app backend
    location /planter_app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # GPS Hat web interface (status page, WiFi config)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
