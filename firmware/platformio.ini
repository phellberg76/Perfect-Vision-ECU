; PlatformIO Project Configuration File
;
; Raspberry Pi Backup Power and GPS Hat v4
; ESP32-S3-MINI-1 Firmware
;
; Purpose: GPS data relay to Raspberry Pi
;
; Hardware connections for flashing:
;   RPi UART (ttyAMA0) -> ESP32 UART
;   RPi GPIO17 -> ESP32 EN (reset)
;   RPi GPIO27 -> ESP32 IO0 (boot mode)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; USB CDC for serial output (when connected via USB)
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3

; Upload via RPi UART
upload_port = /dev/ttyAMA0
upload_speed = 460800
upload_protocol = esptool

; Serial monitor
monitor_port = /dev/ttyAMA0
monitor_speed = 115200
