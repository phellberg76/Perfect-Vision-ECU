; PlatformIO Project Configuration File
;
; Raspberry Pi Backup Power and GPS Hat v4
; ESP32-S3-MINI-1 Firmware
;
; Purpose: GPS data relay to Raspberry Pi

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; USB CDC for serial communication with RPi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600
