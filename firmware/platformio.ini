; PlatformIO Project Configuration File
;
; Raspberry Pi Backup Power and GPS Hat v4
; ESP32-S3-MINI-1 Unified Firmware
;
; Features:
;   - GPS data via SPI slave interface
;   - WiFi client for internet connectivity
;   - PPP server for network sharing to RPi
;
; Hardware connections:
;   - SPI: Slave mode on shared bus with MCP2515 CAN controllers
;   - UART0: PPP link to RPi (or debug before PPP starts)
;   - UART1: GPS module (NEO-M9N)

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build configuration
build_flags =
    ; Enable USB CDC for debug logging (separate from UART0 PPP)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Enable IP NAT/NAPT for PPP forwarding
    -DIP_NAPT=1
    -DIP_FORWARD=1
    -DLWIP_IPV4=1
    ; Suppress ESP32 core debug logging (prevents UART corruption)
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.0

; Upload via RPi UART (before PPP mode)
upload_port = /dev/ttyAMA0
upload_speed = 460800
upload_protocol = esptool

; Serial monitor (before PPP mode)
monitor_port = /dev/ttyAMA0
monitor_speed = 115200

; Alternative: USB upload
[env:esp32s3-usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DIP_NAPT=1
    -DIP_FORWARD=1
    -DLWIP_IPV4=1

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^7.0.0

upload_protocol = esptool
monitor_speed = 115200
