; PlatformIO Project Configuration File
;
; Raspberry Pi Backup Power and GPS Hat v4
; ESP32-S3-MINI-1 BLE Bridge Firmware
;
; Features:
;   - GPS data acquisition (NEO-M9N on UART1)
;   - BLE GATT server for Flutter app communication
;   - UART bridge to RPi for backend HTTP proxy
;
; Hardware connections:
;   - UART0: Commands/responses to RPi
;   - UART1: GPS module (NEO-M9N)
;   - BLE: Flutter app communication

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Build configuration
build_flags =
    ; Suppress ESP32 core debug logging (prevents UART corruption)
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    ; NimBLE configuration for better performance
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=512

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^1.4.0

; Upload via RPi UART
upload_port = /dev/ttyAMA0
upload_speed = 460800
upload_protocol = esptool

; Serial monitor
monitor_port = /dev/ttyAMA0
monitor_speed = 115200

; Alternative: USB upload
[env:esp32s3-usb]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=512

lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^1.4.0

upload_protocol = esptool
monitor_speed = 115200
